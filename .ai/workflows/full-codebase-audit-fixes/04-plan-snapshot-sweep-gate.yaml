    kind: replaces
    label: "DocScreenshotGenerator produces independent PNGs from same geometry code"
risks:
  - id: R1
    title: "Cross-platform pixel drift (Windows record vs CI Linux)"
    severity: high
    body: >
      Paparazzi 1.3.0 is known to produce slightly different pixel values between
      record host (Windows JVM) and verify host (CI ubuntu-latest). Issues #1465 and #1716.
      Local recordPaparazziDebug green does NOT close AC-S2. The gate closes when CI
      verifyPaparazziDebug passes the record commit.
    mitigation: >
      Primary: push record commit, watch CI build job. Fallback: if CI fails on drift-only
      pixels (not geometry), set a deliberate minimal maxPercentDifference (e.g. 0.5%) with
      reason in build.gradle.kts and record the decision in po-answers.md. Decision is
      PO-DECISION-PENDING — see Blockers.
  - id: R2
    title: "Unattributable golden diff"
    severity: blocker
    body: >
      Any PNG diff outside the expected-change set {octahedron, knot, sampleThree, plus
      alphaSampleScene conditionally for G1} is an unattributable regression. This slice
      never patches code — the diff reopens the owning content slice.
    mitigation: >
      Attribution ledger step (Step 3 in Step-by-Step) formalizes the check. Fail fast:
      inspect every changed golden before committing the snapshot commit. If any diff is
      unattributable, halt and reopen the owning slice.
  - id: R3
    title: "Partially recorded goldens in working tree"
    severity: med
    body: >
      The isometric-compose/src/test/snapshots/ directory is UNTRACKED (never committed).
      It contains 29 PNGs from a prior recordPaparazziDebug run (timestamp unknown, author
      unknown from git history — the directory predates the current sweep). These goldens
      may be stale relative to the current code (e.g., depth-sort fixes in eea28bb/4489761
      may have changed rendering since the record).
    mitigation: >
      Do not treat existing goldens as authoritative. The Step-by-Step plan's Step 2
      discards them by running a fresh recordPaparazziDebug after all content slices have
      landed. The attribution ledger then scores every output golden, not just the two
      expected-change PNGs.
  - id: R4
    title: "Doc screenshots partially re-run (modified unstaged)"
    severity: med
    body: >
      docs/assets/screenshots/grid.png and multiple-shapes.png are modified in the
      working tree but not committed. This indicates DocScreenshotGenerator was run at some
      point during the WS10 / depth-sort work. These PNGs must not be committed in their
      current state without inspecting what changed — they were not part of an attributed
      sweep-gate pass.
    mitigation: >
      Step 5 (DocScreenshotGenerator) runs generateAll() after all content slices land,
      overwriting any pre-existing working-tree modifications. Attribution is then against
      the sweep's known geometry changes.
history: []
