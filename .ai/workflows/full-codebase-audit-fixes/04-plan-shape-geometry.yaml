risks:
  - id: risk-red-goldens
    title: "Known-red Paparazzi goldens between this slice and snapshot-sweep-gate"
    severity: high
    body: "After B1/B2 land, isometric-compose snapshot tests will fail on octahedron.png and knot.png (and potentially composite scenes containing those shapes). This is expected and pre-registered. The slice verify explicitly scopes to unit tests only; the red goldens are attributed and noted in the verify artifact so they do not alarm reviewers."
    mitigation: "scope unit-test verify only; attribute red goldens explicitly; snapshot-sweep-gate slice clears them"
  - id: risk-b1-depth-sort
    title: "B1 geometry change may regress depth sorting for Octahedron faces"
    severity: med
    body: "The corrected (unit-cube) proportions change every face's screen-space projection. The existing path-count guard (8 faces) is necessary but not sufficient — a degenerate face (zero signed area) or winding flip would allow depth-sorting to silently misbehave. OctahedronGeometryTest adds winding guards (non-zero signed area, consistent sign per upper/lower set) to surface this before a visual artifact appears at re-record."
    mitigation: "New winding assertions in OctahedronGeometryTest fail before the re-record; any depth-sort regression becomes a test failure, not a silent visual artifact"
  - id: risk-cylinder-constructor
    title: "Cylinder constructor refactor must not change the public API signature"
    severity: low
    body: "The fix to move validation before Circle instantiation requires a structural change (private factory or companion). The public constructor signature (@JvmOverloads, default arguments) must be preserved exactly. apiDump must not change."
    mitigation: "Keep @JvmOverloads and identical parameter list; use a private companion factory for the validation-then-construct pattern; run apiCheck after the fix"

