    file: isometric-compose/src/main/kotlin/io/github/jayteealao/isometric/compose/runtime/IsometricScene.kt
    line: 148
    confidence: med
    action: defer
    status: deferred
    pre-existing: false
    surfaced-at: "2026-07-07T19:11:28Z"
    msg: >
      projectionVersion polling busy-loop: while(true)/delay(16L) runs at ~60
      polls/second indefinitely on idle scenes, burning CPU even when the engine
      angle/scale never changes.
    evidence:
      snippet: "while (true) { delay(16L); val current = engine.projectionVersion; if (current != lastVersion) { sceneVersion++ } }"
    fix: >
      Expose a Flow<Int>/StateFlow<Int> from IsometricEngine or use
      snapshotFlow { engine.projectionVersion } so the LaunchedEffect
      collects reactively instead of polling.

