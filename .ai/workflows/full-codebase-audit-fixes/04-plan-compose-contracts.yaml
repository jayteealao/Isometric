risks:
  - id: R1
    title: "RenderContext @Immutable: adding accumulatedAlpha must keep all fields val"
    severity: med
    body: "RenderContext is annotated @Immutable. Adding accumulatedAlpha as a val constructor param is safe; a mutable field would violate @Immutable and potentially the Compose runtime's stability guarantees. The implementation plan uses a val with a default of 1f, exactly mirroring how accumulatedScale is handled."
    mitigation: "Declare accumulatedAlpha as val in the primary constructor with default 1f. The withAlpha factory follows the withTransform pattern — it creates a new RenderContext rather than mutating."

  - id: R2
    title: "apiDump churn if E4 annotation swap is needed — but E4 is already done"
    severity: low
    body: "The original E4 risk was that swapping @Immutable→@Stable on SceneConfig/AdvancedSceneConfig might change $stable synthetic fields in the API dump. Commit 187e8f4 already performed this swap on SceneConfig and regenerated dumps. AdvancedSceneConfig still carries @Stable (correct for a class with mutable engine). Only G1's Group composable alpha parameter will change the dump."
    mitigation: "Run apiDump post-G1; verify diff shows only the Group alpha addition. No E4 dump work remains."

  - id: R3
    title: "alpha=0 semantics: skip vs transparent — PO decision required"
    severity: high
    body: "alpha=0 in GroupNode can be handled two ways: (a) early return — zero-cost, correct for most uses, but children invisible regardless of any override; (b) propagate alpha=0.0f — renders fully transparent, wastes the full render traversal. Recommendation: early return (option a) because it is idiomatic (isVisible=false already has this contract), provides a free performance win for hidden groups, and matches how graphicsLayer(alpha=0f) works in Compose itself. The PO must confirm."
    mitigation: "Implement early return for alpha == 0f in GroupNode.renderTo; document in KDoc."

  - id: R4
    title: "Cross-slice file-overlap with gesture-coordination on IsometricScene.kt"
    severity: low
    body: "gesture-coordination restructures IsometricScene.kt; this slice does NOT touch IsometricScene.kt. The overlap risk is limited to IsometricNode.kt and RenderContext.kt — gesture-coordination does not touch these. Sequencing: compose-contracts should commit before gesture-coordination to keep apiDump attribution clean."
    mitigation: "Commit compose-contracts first on the shared branch; gesture-coordination rebases on top."

