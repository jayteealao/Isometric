risks:
  - id: risk-1
    title: "Docs describe intent, not landed behavior"
    severity: high
    body: "Every accuracy AC is judged against the landed code from four dependency slices. If a fix drifted during implement (e.g., the C1 disambiguation window ended up 350ms not 300ms, or Group.alpha was implemented differently than planned), this slice must recheck and rewrite. The plan is concrete about WHERE each edit goes and WHAT it must cover, but final wording must be verified against the landed diffs at implement time — not authored from the plan."
    mitigation: "Step 0 of implement: read the landed diffs from core-math, gesture-coordination, compose-contracts, shape-geometry before writing a single sentence. Cross-check each AC against the actual implementation."

  - id: risk-2
    title: "Mirror drift from hand-edits"
    severity: med
    body: "docs/*.md are generated by sync-docs.js. Any hand-edit to a mirror is silently overwritten on the next sync run. The uncommitted CHANGELOG diff shows the working tree has partial CHANGELOG edits already; if those are included in the sync scope they could corrupt the mirror logic."
    mitigation: "CHANGELOG.md is NOT in the sync scope (sync-docs.js only touches docs/*.md from site/src/content/docs/*.mdx). Confirm by reading sync-docs.js before implement. Run sync-docs.js once at the end of all .mdx edits; diff the output before committing."

  - id: risk-3
    title: "CHANGELOG uncommitted partial edits"
    severity: med
    body: "git diff shows CHANGELOG.md already has an uncommitted Migration Notes section (the compose/drag DragEvent.x/y note). This content partially overlaps with the E3 task. If this diff was authored mid-workflow, it may be the right content; if it predates the workflow it may be incomplete."
    mitigation: "At implement time: read the full CHANGELOG diff, determine whether the existing Migration Notes content is final or a draft. E3 adds three Features entries and a Migration subsection per break; the existing DragEvent note is G4's verify target and may fold into the E3 Migration subsection."

