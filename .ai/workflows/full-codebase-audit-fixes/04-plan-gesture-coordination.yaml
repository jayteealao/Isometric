risks:
  - id: R1
    title: "Restructure breaks existing tap/long-press/drag behavior"
    severity: high
    body: >
      Merging the two pointerInput blocks changes event routing. detectTapGestures internally
      uses awaitFirstDown(requireUnconsumed=true), so any upstream consumption in the same
      block can starve it. The combined handler must not consume Press/Release before
      detectTapGestures sees them.
    mitigation: >
      Use detectTapGestures as the outer wrapper for tap/double-tap disambiguation.
      The hand-rolled logic for long-press, drag, and node-drag runs inside the same
      awaitEachGesture block or as a co-routine launched from detectTapGestures' press
      callback. Consume events ONLY on Move while dragging (existing C2-correct behavior).
      All existing JVM tests + new tests must pass before closing.
  - id: R2
    title: "pointerInput keying: wrong key re-introduces stale state or drops double-tap window"
    severity: med
    body: >
      The current two blocks are keyed on Unit (never restart). After the merge, if we key
      on a value that changes (e.g., the presence of onDoubleClick), the handler restarts
      mid-gesture, losing state. The recomposition edge case from the slice definition.
    mitigation: >
      Key the single merged block on Unit. Use rememberUpdatedState for all values the
      handler needs fresh access to (currentGestures, currentCameraState, etc.) — this
      pattern is already present and correct. Never key on a callback reference that changes
      per-recomposition.
  - id: R3
    title: "Emulator AVD boot failure blocks AC-S3"
    severity: med
    body: >
      The instrumented gate (AC-S3) requires an AVD managed by android-cli. If the emulator
      cannot boot (HAXM unavailable, SDK path missing), the live-routing evidence cannot
      be collected in this slice.
    mitigation: >
      Fallback chain: Robolectric covers the state machine (rungs 1 in the Android ladder);
      if AVD boot fails, record the boot failure and defer only the live multi-touch routing
      residual with named clearing event. The JVM tests remain the primary gate; the emulator
      run is additive evidence.
