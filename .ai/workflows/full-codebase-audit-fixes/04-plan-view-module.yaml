risks:
  - id: risk-1
    title: "AC-D1 allocation assertion: Robolectric Canvas is a stub"
    severity: low
    body: "Robolectric's Canvas shadow does not rasterise pixels or count drawPath calls, so a true per-draw allocation count cannot be asserted from JVM unit tests. The AC wording ('zero Paint objects per draw call') is satisfied by code-review verification of the single-instance pattern + the per-face reset sequence in AndroidCanvasRenderer.kt — the test proxy is the consecutive-draw scene-identity assertion (ac8_renderIsIdenticalOnConsecutiveDrawsAfterM5Reuse)."
    mitigation: "Plan records this as code-review + proxy-test verification per the AC's own observable:false annotation. No new test required; the residual is a review step, not code."
  - id: risk-2
    title: "D2 KDoc fix is a one-line change; easy to forget to match GestureEvents.kt exactly"
    severity: low
    body: "The KDoc must be aligned precisely with GestureEvents.kt line 34-44 ('live pointer position when delivered to onDrag'). If the fix under-specifies the onDrag semantics, a developer reading the sample will still misunderstand."
    mitigation: "Plan step cross-references GestureEvents.kt line 34-44 as the normative source. Manual read-through at review stage is the acceptance gate."
  - id: risk-3
    title: "D3 lazy vs. eager rebuild: confirmed lazy (sceneDirty + invalidate)"
    severity: low
    body: "The D3 slice definition allowed either lazy or eager rebuild. The landed implementation is lazy (sceneDirty flag in onDraw). This is the preferable approach — no projection overhead before the next draw cycle. No further action required; recording here that the question was settled."
    mitigation: "No mitigation needed. Confirmed correct."
