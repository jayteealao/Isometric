risks:
  - id: R1
    title: "A1 rotation matrices may already be correct — verify before flipping"
    severity: high
    body: "The branch has several commits since the audit (eea28bb, 9b30c52, 187e8f4). The rotateX and rotateY implementations must be verified against AC-A1a BEFORE writing tests, to avoid writing tests that pass against broken code because both the test and the production code reflect the same wrong sign. Use a stash/revert to verify the test fails against the original."
    mitigation: "Step 1 of the plan: run AC-A1a assertions against current code first. If they pass, no sign flip needed — only KDoc. If they fail, flip then test."

  - id: R2
    title: "TileCoordinate.hashCode ORIGIN still returns 0"
    severity: high
    body: "Current code is `x * 1_000_003 xor y`. For ORIGIN (0,0): 0 * 1_000_003 xor 0 = 0. AC-A7 requires ORIGIN.hashCode() != 0. The formula needs a different approach — e.g., Objects.hash(x, y) or 31 * x + y or x.hashCode() * 31 + y.hashCode()."
    mitigation: "Use the standard Kotlin/JVM idiom: `var result = x; result = 31 * result + y; return result` — or switch to `Objects.hash(x, y)`. Verify the (k, k*1_000_003) distribution requirement also holds."

  - id: R3
    title: "A3 internal callers must move to private helper before public fix"
    severity: med
    body: "hasIntersection and hasInteriorIntersection both call the public isPointCloseToPoly. If the inside-test is added to the public function first, the depth-sorter's intersection logic changes semantics immediately, potentially breaking depth-sort correctness before the regression net is in place."
    mitigation: "Strictly follow the ordering constraint: (1) extract private isPointCloseToEdges helper, (2) migrate hasIntersection/hasInteriorIntersection to the private helper, (3) run full IntersectionUtils+DepthSorter suite to confirm no regression, (4) add inside-test to public isPointCloseToPoly, (5) add AC-A3 test."
