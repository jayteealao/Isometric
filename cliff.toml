[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.
Generated by [git-cliff](https://git-cliff.org/) from [Conventional Commits](https://www.conventionalcommits.org/).

"""

# NOTE on whitespace: this is a TOML basic ("""...""") string, so a line-ending
# backslash is TOML line-continuation (it trims the trailing newline). Keep the
# backslash only on Tera control lines ({% if %}, {% for %}) so they emit no
# blank line; content lines (headings, commits) must NOT end with a backslash so
# their newlines survive and each commit renders as its own list item.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""

trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# Clean up commit messages before they are parsed and grouped, so internal
# workstream vocabulary never reaches the user-facing changelog.
commit_preprocessors = [
  # Drop internal workstream scopes, e.g. "feat(ws10): ..." -> "feat: ..."
  { pattern = '(?i)\(ws\d+\)', replace = "" },
  # Drop stray workstream tokens left in the subject, e.g. "... holes in WS9 docs"
  { pattern = '(?i)\s*\bws\d+\b', replace = "" },
]

# Parsers run in order; first match wins. The skip rules come first so internal
# tooling/process commits never reach the grouped, user-facing output.
commit_parsers = [
  { message = "(?i)^chore",                             skip = true },
  { message = "(?i)^ci",                                skip = true },
  { message = "(?i)bump to .*(snapshot|alpha|beta|rc)", skip = true },
  { message = "(?i)prepare release",                    skip = true },
  { message = "(?i)prepare-pr",                         skip = true },
  { message = "(?i)(greptile|coderabbit)",              skip = true },
  { message = "(?i)update api dump",                     skip = true },

  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^perf",     group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs",     group = "Documentation" },
  { message = "^test",     group = "Testing" },
  { message = "^build",    group = "Build System" },
  { message = "^revert",   group = "Reverts" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
# Exclude the legacy Java-library tags inherited in git history
# (v0.0.4–v0.0.6.2, 0.0.8, 0.0.9; 2017–2018). The Kotlin/Compose rewrite starts
# at v0.0.0 (2026), which this pattern leaves untouched.
skip_tags = "v?0\\.0\\.[4-9].*"
topo_order = false
sort_commits = "oldest"
